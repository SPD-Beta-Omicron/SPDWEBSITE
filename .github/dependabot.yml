version: 2
updates:
  # Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  # Python packages in requirements.txt
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/Containerization"
    schedule:
      interval: "monthly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # The FROM line in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/Containerization"
    schedule:
      interval: "monthly"